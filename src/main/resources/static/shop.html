<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop - Agrilink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
    <style>
        body { background: linear-gradient(180deg, #eaf2ff 0%, #f8fbff 100%); color: #1b3f75; }
        .product-card { border-radius: 1.35rem; transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(35, 85, 155, 0.08); }
        .btn-outline-secondary { border-color: #8f9fbf; color: #38548f; }
        .btn-outline-secondary:hover { background: rgba(56, 84, 143, 0.08); }
        .btn-outline-primary { color: #1b3f75; border-color: #1b3f75; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 text-success">Marketplace</h1>
            <p class="text-muted mb-0">Browse available agricultural products.</p>
        </div>
        <div class="d-flex gap-2">
            <a href="customer-dashboard.html" class="btn btn-outline-secondary">Back to Dashboard</a>
            <a href="index.html" class="btn btn-outline-primary">Logout</a>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-12">
            <div class="card product-card shadow-sm p-5 text-center">
                <h4 class="text-muted">No products available yet.</h4>
                <p class="text-muted mb-0">Register and add products to populate the marketplace.</p>
            </div>
        </div>
    </div>
</div>
<script>
  (function() {
    const theme = localStorage.getItem('agrilinkTheme');
    if (theme === 'dark') document.body.classList.add('theme-dark');
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
