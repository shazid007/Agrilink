<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Dashboard - Agrilink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
    <style>
        body { background: linear-gradient(180deg, #eef5ff 0%, #f8fbff 100%); color: #0f3b6a; }
        .wallet-card { border-radius: 1.5rem; border: 1px solid rgba(56, 102, 199, 0.12); }
        .btn-primary { background-color: #1f5bb5; border-color: #1f5bb5; }
        .btn-primary:hover { background-color: #15457f; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
        <div>
            <h1 class="h3 text-primary">Customer Hub</h1>
            <p class="text-muted mb-0">Explore products, top up your wallet, and track orders.</p>
        </div>
        <div class="d-flex gap-2">
            <a href="index.html" class="btn btn-outline-primary">Logout</a>
            <a href="shop.html" class="btn btn-primary">Shop Now</a>
        </div>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-md-7">
            <div class="card wallet-card shadow-sm p-4 fade-in">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <p class="text-uppercase text-muted mb-1">Wallet Balance</p>
                        <h2 id="walletBalance">$0.00</h2>
                    </div>
                    <a href="wallet-topup.html" class="btn btn-outline-success">Top-up Wallet</a>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm fade-in">
        <div class="card-body">
            <h5 class="mb-3">Recent Orders</h5>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Order ID</th>
                            <th>Order Date</th>
                            <th>Total</th>
                            <th>Delivery Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="4" class="text-center text-muted py-4">No orders yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
    const walletBalance = document.getElementById('walletBalance');

    async function loadCustomerWallet() {
        const stored = localStorage.getItem('agrilinkUser');
        if (!stored) return;
        const { userId } = JSON.parse(stored);
        const response = await fetch(`/api/user?userId=${encodeURIComponent(userId)}`);
        if (!response.ok) return;
        const data = await response.json();
        walletBalance.textContent = `$${Number(data.walletBalance).toFixed(2)}`;
    }

    loadCustomerWallet();
</script>
<script>
  (function() {
    const theme = localStorage.getItem('agrilinkTheme');
    if (theme === 'dark') document.body.classList.add('theme-dark');
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
