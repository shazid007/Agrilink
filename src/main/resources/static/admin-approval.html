<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Approvals - Agrilink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
    <style>
        body { background: linear-gradient(180deg, #eaf0ff 0%, #f7f9ff 100%); color: #102f62; }
        .table-card { border-radius: 1.4rem; }
        .btn-approve { background-color: #1b3f75; color: #fff; }
        .btn-reject { background-color: #dc3545; color: #fff; }
        .btn-outline-secondary { color: #1b3f75; border-color: #c5d1ea; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 text-success">Pending Product Approvals</h1>
            <p class="text-muted mb-0">Review new agricultural products before they appear in the marketplace.</p>
        </div>
        <div class="d-flex gap-2">
            <a href="admin-dashboard.html" class="btn btn-outline-secondary">Back to Dashboard</a>
            <a href="index.html" class="btn btn-outline-primary">Logout</a>
        </div>
    </div>
    <div class="card table-card shadow-sm fade-in">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Product ID</th>
                            <th>Farmer Name</th>
                            <th>Item</th>
                            <th>Quantity</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="5" class="text-center text-muted py-4">No pending products yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
  (function() {
    const theme = localStorage.getItem('agrilinkTheme');
    if (theme === 'dark') document.body.classList.add('theme-dark');
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
