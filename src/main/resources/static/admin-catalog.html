<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Catalog - Agrilink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
    <style>
        body { background: linear-gradient(180deg, #eaf0ff 0%, #f7f9ff 100%); color: #102f62; }
        .page-heading { color: #1b3f75; }
        .table-card { border-radius: 1.4rem; }
        .btn-success { background-color: #1b3f75; border-color: #1b3f75; }
        .btn-success:hover { background-color: #152f5a; }
        .btn-outline-secondary { color: #1b3f75; border-color: #c5d1ea; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 page-heading">Manage Catalog</h1>
            <p class="text-muted mb-0">Add new items and review your marketplace catalog.</p>
        </div>
        <div class="d-flex gap-2">
            <a href="admin-dashboard.html" class="btn btn-outline-secondary">Back to Dashboard</a>
            <a href="index.html" class="btn btn-outline-primary">Logout</a>
        </div>
    </div>

    <div class="card shadow-sm mb-4 p-4 fade-in">
        <h5 class="mb-3">Add New Catalog Item</h5>
        <form class="row g-3">
            <div class="col-md-3">
                <label class="form-label">Item Name</label>
                <input type="text" class="form-control" placeholder="Wheat" />
            </div>
            <div class="col-md-3">
                <label class="form-label">Grade</label>
                <input type="text" class="form-control" placeholder="Premium" />
            </div>
            <div class="col-md-3">
                <label class="form-label">Base Price per kg</label>
                <input type="number" class="form-control" placeholder="120" />
            </div>
            <div class="col-md-3 d-flex align-items-end">
                <button type="submit" class="btn btn-success w-100">Add Item</button>
            </div>
        </form>
    </div>

    <div class="card table-card shadow-sm fade-in">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Item Name</th>
                            <th>Grade</th>
                            <th>Base Price per kg</th>
                            <th>Available Quantity</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="4" class="text-center text-muted py-4">No catalog items yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
  (function() {
    const theme = localStorage.getItem('agrilinkTheme');
    if (theme === 'dark') document.body.classList.add('theme-dark');
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
